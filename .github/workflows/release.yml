name: Package and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Update and push application version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not contain an application version" >&2
            exit 1
          }
          python3 scripts/update-version.py "${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/appinfo.json
          if git diff --cached --quiet; then
            echo "src/appinfo.json is already up to date"
            exit 0
          fi
          git commit -m "chore: sync app version ${version}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Package application
        run: |
          mkdir --parents dist
          ares-package src --outdir dist

      - name: Generate release manifest
        shell: bash
        run: |
          ipk="$(find dist -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          test -n "${ipk}" || {
            echo "The webOS CLI did not produce an IPK" >&2
            exit 1
          }
          python3 scripts/generate-manifest.py "${ipk}" "dist/it.siriosdev.tvlauncher.manifest.json"

      - name: Create release without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ipk="$(find dist -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          gh release create "${GITHUB_REF_NAME}" \
            "${ipk}" \
            "dist/it.siriosdev.tvlauncher.manifest.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TVLauncher ${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes
