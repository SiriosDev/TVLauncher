name: Package and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install webOS CLI
        run: npm install --global @webos-tools/cli

      - name: Read application version
        id: app
        shell: bash
        run: |
          version="$(python3 -c 'import json; print(json.load(open("src/appinfo.json", encoding="utf-8"))["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${version}" >&2
            exit 1
          }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Package application
        run: |
          mkdir --parents dist
          ares-package src --outdir dist

      - name: Generate release manifest
        shell: bash
        run: |
          ipk="$(find dist -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          test -n "${ipk}" || {
            echo "The webOS CLI did not produce an IPK" >&2
            exit 1
          }
          python3 scripts/generate-manifest.py "${ipk}" "dist/it.siriosdev.tvlauncher.manifest.json"

      - name: Create release without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ipk="$(find dist -maxdepth 1 -type f -name '*.ipk' -print -quit)"
          gh release create "${GITHUB_REF_NAME}" \
            "${ipk}" \
            "dist/it.siriosdev.tvlauncher.manifest.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TVLauncher ${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes
