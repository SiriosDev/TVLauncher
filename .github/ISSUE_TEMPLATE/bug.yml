name: Bug report
description: Report a reproducible problem with TVLauncher.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TVLauncher. Please provide enough detail to reproduce the problem.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include any visible error message.
    validations:
      required: true

  - type: input
    id: tv-model
    attributes:
      label: TV model
      placeholder: LG NANO77
    validations:
      required: true

  - type: input
    id: webos-version
    attributes:
      label: webOS version
      placeholder: webOS version, if known
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Homebrew Channel
        - Ares CLI
        - webOS Dev Manager Desktop
        - LG Dev Manager
        - Other
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: TVLauncher version
      placeholder: 0.0.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant logs, screenshots, or videos. Remove sensitive information.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked that this bug has not already been reported.
          required: true
        - label: I have included reproducible steps and the environment details.
          required: true
